<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FL Woods buoy">
  <!-- Top hoisting eyelet -->
  <circle cx="32" cy="8" r="3.5" fill="none" stroke="#2a1a0a" stroke-width="2.5"/>
  <!-- Strap linking eyelet to buoy -->
  <rect x="29.5" y="11" width="5" height="7" rx="1" fill="#2a1a0a"/>
  <!-- Buoy ball — classic starboard-mark red -->
  <circle cx="32" cy="40" r="22" fill="#c8102e"/>
  <!-- Subtle gloss highlight so it reads spherical, not flat -->
  <ellipse cx="24" cy="30" rx="7" ry="5" fill="#ffffff" opacity="0.28"/>
  <!-- Faint shadow arc on the far side -->
  <path d="M 52 44 A 22 22 0 0 1 34 62" fill="none" stroke="#8a0a1e" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
</svg>
